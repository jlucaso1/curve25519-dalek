[files]
extend-exclude = [
    ".git/",
    "*.svg",
    "TESTVECTORS",
    # Task prompts, written in Portuguese. Every hit in them is a correct
    # Portuguese word read as an English misspelling — "cliente", "itens",
    # "ser", "limite", "commite". Excluding the directory keeps the exemption
    # where it belongs; adding the words to `extend-words` would instead stop
    # `ser`->`set` and `limite`->`limit` being caught in English prose and code
    # anywhere in the repository.
    "agent_prompts/"
]

[default]
extend-ignore-re = [
    # Patterns which appear to be 36 or more characters of Base64/Base64url
    '\b[0-9A-Za-z+/]{36,}\b',
    '\b[0-9A-Za-z_-]{36,}\b',
]

[default.extend-words]
"AKE" = "AKE" # Authenticated Key Exchange
"Ono" = "Ono" # Surname
"Tung" = "Tung" # Name
"Monts" = "Monts" # Abbreviation for Montgomery
